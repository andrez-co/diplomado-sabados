<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfigCat Feature Toggle - Dark Mode</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>

  <!-- ConfigCat SDK CDN -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@configcat/sdk@latest/dist/configcat.browser.umd.min.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 flex flex-col items-center justify-center p-6">
  
  <main class="w-full max-w-lg bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-8 text-center transition-all duration-300">
    <!-- Icon Header -->
    <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 shadow-inner">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>

    <!-- Title & Description -->
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-3xl">
      ConfigCat Feature Toggle
    </h1>
    <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
      Evaluación en tiempo real del flag <code class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 font-mono text-indigo-600 dark:text-indigo-400 font-semibold">dark_mode_enabled</code>.
    </p>

    <!-- Status Card -->
    <div class="mt-6 p-4 rounded-xl bg-slate-100 dark:bg-slate-700/60 border border-slate-200 dark:border-slate-600/50 flex items-center justify-between text-left">
      <div>
        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Estado del Flag</p>
        <p id="flag-status-text" class="text-sm font-medium text-slate-700 dark:text-slate-200">Consultando ConfigCat...</p>
      </div>
      <span id="flag-status-badge" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-900/50 dark:text-amber-300">
        Cargando
      </span>
    </div>

    <!-- Centered Dark Mode Toggle Button (Hidden by default until flag evaluates to true) -->
    <div id="toggle-container" class="mt-8 flex justify-center items-center min-h-[52px]">
      <button
        id="dark-mode-toggle"
        type="button"
        class="hidden inline-flex items-center justify-center gap-2.5 px-6 py-3 rounded-xl font-medium text-white shadow-lg transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600 focus:outline-none focus:ring-4 focus:ring-indigo-300 dark:focus:ring-indigo-800 cursor-pointer"
        aria-label="Alternar modo oscuro"
      >
        <!-- Moon Icon -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <!-- Sun Icon (hidden in light mode) -->
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span id="button-label">Cambiar a Modo Oscuro</span>
      </button>

      <!-- Message shown when flag is disabled -->
      <p id="disabled-notice" class="hidden text-xs text-slate-500 dark:text-slate-400 italic">
        El botón de alternar tema se encuentra deshabilitado por Feature Toggle.
      </p>
    </div>
  </main>

  <!-- JavaScript Logic -->
  <script type="text/javascript">
    const SDK_KEY = "configcat-sdk-1/rjDfCNA7ZUuM4iC_A6A2fQ/IdaMKPoRGkm4k4aOlW3P7g";
    const FLAG_NAME = "dark_mode_enabled";

    const toggleBtn = document.getElementById("dark-mode-toggle");
    const disabledNotice = document.getElementById("disabled-notice");
    const flagStatusText = document.getElementById("flag-status-text");
    const flagStatusBadge = document.getElementById("flag-status-badge");
    const iconMoon = document.getElementById("icon-moon");
    const iconSun = document.getElementById("icon-sun");
    const buttonLabel = document.getElementById("button-label");

    // Función para actualizar los elementos visuales del botón según la clase 'dark' en <html>
    function updateButtonVisuals() {
      const isDark = document.documentElement.classList.contains("dark");
      if (isDark) {
        iconMoon.classList.add("hidden");
        iconSun.classList.remove("hidden");
        buttonLabel.textContent = "Cambiar a Modo Claro";
      } else {
        iconMoon.classList.remove("hidden");
        iconSun.classList.add("hidden");
        buttonLabel.textContent = "Cambiar a Modo Oscuro";
      }
    }

    // Alternar la clase 'dark' en el elemento <html> al hacer clic
    toggleBtn.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      updateButtonVisuals();
    });

    // Actualizar visibilidad del botón según el valor del flag booleano
    function applyFeatureToggle(isEnabled) {
      if (isEnabled === true) {
        // Mostrar botón centrado
        toggleBtn.classList.remove("hidden");
        toggleBtn.style.display = "inline-flex";
        disabledNotice.classList.add("hidden");

        // Actualizar badges
        flagStatusText.textContent = "dark_mode_enabled = true (Habilitado)";
        flagStatusBadge.textContent = "Activo";
        flagStatusBadge.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300";
      } else {
        // Ocultar el botón por completo
        toggleBtn.classList.add("hidden");
        toggleBtn.style.display = "none";
        disabledNotice.classList.remove("hidden");

        // Actualizar badges
        flagStatusText.textContent = "dark_mode_enabled = false (Deshabilitado)";
        flagStatusBadge.textContent = "Inactivo";
        flagStatusBadge.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-300";
      }
      updateButtonVisuals();
    }

    // Inicializar ConfigCat SDK
    function initConfigCat() {
      if (typeof configcat === "undefined") {
        console.error("ConfigCat SDK no se pudo cargar desde el CDN.");
        flagStatusText.textContent = "Error al cargar ConfigCat SDK";
        flagStatusBadge.textContent = "Error";
        flagStatusBadge.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-300";
        applyFeatureToggle(false);
        return;
      }

      const client = configcat.getClient(
        SDK_KEY,
        configcat.PollingMode.AutoPoll,
        {
          pollIntervalSeconds: 15,
          setupHooks: (hooks) => {
            hooks.on("configChanged", async () => {
              const value = await client.getValueAsync(FLAG_NAME, false);
              console.log("ConfigCat configChanged - dark_mode_enabled:", value);
              applyFeatureToggle(value);
            });
          }
        }
      );

      // Evaluación inicial
      client.getValueAsync(FLAG_NAME, false)
        .then((value) => {
          console.log("ConfigCat evaluación inicial - dark_mode_enabled:", value);
          applyFeatureToggle(value);
        })
        .catch((error) => {
          console.error("Error al evaluar el flag:", error);
          applyFeatureToggle(false);
        });
    }

    // Iniciar cuando el DOM esté listo
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initConfigCat);
    } else {
      initConfigCat();
    }
  </script>
</body>
</html>
